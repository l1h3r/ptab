[package]
name = "ptab"
version = "0.1.7"
authors = ["l1h3r <5410284+l1h3r@users.noreply.github.com>"]
categories = ["concurrency", "data-structures", "memory-management"]
description = "Lock-free concurrent table optimized for read-heavy workloads"
documentation = "https://docs.rs/ptab"
edition = "2024"
keywords = ["atomic", "concurrent", "lock-free"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/l1h3r/ptab"
rust-version = "1.91"
exclude = [".github", "bin", "release.toml", "rustfmt.toml"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true
rustdoc-args = [
  "--generate-link-to-definition",
  "--generate-macro-expansion",
  "--extern-html-root-url=core=https://doc.rust-lang.org",
  "--extern-html-root-url=alloc=https://doc.rust-lang.org",
  "--extern-html-root-url=std=https://doc.rust-lang.org",
]

[dependencies]
sdd = { version = "4.8", default-features = false, optional = true }

[target."cfg(loom)".dependencies]
loom = { version = "0.7", default-features = false, optional = true }

[target."cfg(loom)".dev-dependencies]
loom = { version = "0.7", default-features = false }

[target."cfg(shuttle)".dependencies]
shuttle = { version = "0.9", default-features = false, optional = true }

[target."cfg(shuttle)".dev-dependencies]
shuttle = { version = "0.9", default-features = false }

[features]
default = ["sdd"]

# Enable support for the sdd-based reclamation strategy.
sdd = ["dep:sdd", "std"]

# Enable support for compiling with Rust's standard library.
std = []

# Enable support for compiling with Rust's allocation library.
alloc = []

# Enable tests that are generally quite slow.
#
# This configuration option is outside of the normal semver guarantees: minor
# versions of ptab may make breaking changes to it at any time.
slow = []

# Enable the use of loom for concurrency testing.
#
# This configuration option is outside of the normal semver guarantees: minor
# versions of ptab may make breaking changes to it at any time.
loom = ["dep:loom"]

# Enable the use of shuttle for concurrency testing.
#
# This configuration option is outside of the normal semver guarantees: minor
# versions of ptab may make breaking changes to it at any time.
shuttle = ["dep:shuttle"]

# ------------------------------------------------------------------------------
# Rustc Lints
# https://doc.rust-lang.org/rustc/lints/index.html
# ------------------------------------------------------------------------------

[lints.rust]
# Lint Groups
warnings = { level = "deny", priority = -1 }
deprecated_safe = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }
keyword_idents = { level = "deny", priority = -1 }
let_underscore = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
refining_impl_trait = { level = "deny", priority = -1 }
rust_2018_compatibility = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2021_compatibility = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }
unused = { level = "deny", priority = -1 }

# Standalone Lints
ambiguous_negative_literals = "deny"
closure_returning_async_block = "deny"
deprecated_in_future = "deny"
deref_into_dyn_supertrait = "deny"
ffi_unwind_calls = "deny"
impl_trait_redundant_captures = "deny"
macro_use_extern_crate = "deny"
meta_variable_misuse = "deny"
missing_docs = "deny"
non_ascii_idents = "deny"
redundant_imports = "deny"
redundant_lifetimes = "deny"
single_use_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage,coverage_nightly,kani,loom,shuttle,ptab_miri)", 'cfg(ptab_kani_cache_line, values("16", "32", "64", "128", "256"))'] }
unit_bindings = "deny"
unreachable_pub = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_qualifications = "deny"
variant_size_differences = "deny"

# ------------------------------------------------------------------------------
# Clippy Lints
# https://doc.rust-lang.org/clippy
# ------------------------------------------------------------------------------

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
restriction = { level = "allow", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

# Misc. Noise
cast_possible_truncation = "allow"
doc_markdown = "allow"
empty_enums = "allow"
manual_map = "allow"
must_use_candidate = "allow"
option_if_let_else = "allow"
redundant_pub_crate = "allow"
unused_self = "allow"

# Restriction Lints
alloc_instead_of_core = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
doc_include_without_cfg = "deny"
let_underscore_untyped = "deny"
multiple_unsafe_ops_per_block = "deny"
pub_without_shorthand = "deny"
renamed_function_params = "deny"
self_named_module_files = "deny"
std_instead_of_alloc = "deny"
std_instead_of_core = "deny"
undocumented_unsafe_blocks = "deny"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
unseparated_literal_suffix = "deny"
unused_trait_names = "deny"

# ------------------------------------------------------------------------------
# Rustdoc Lints
# https://doc.rust-lang.org/rustdoc/lints.html
# ------------------------------------------------------------------------------

[lints.rustdoc]
all = { level = "deny", priority = -1 }
